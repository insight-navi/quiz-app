<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中小企業診断士 一次試験 チャレンジクイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- スタート画面 -->
    <section id="start-screen" class="card">
      <p class="label">中小企業診断士 一次試験対策</p>
      <h1>チャレンジクイズ</h1>
      <p class="lead">全7科目から、財務・会計と経済学を重点的に出題します。</p>
      <ul class="info-list">
        <li><span>問題数</span><strong>40問</strong></li>
        <li><span>形式</span><strong>4択</strong></li>
      </ul>
      <button id="start-btn" class="btn btn-primary">スタート</button>
    </section>

    <!-- 問題画面 -->
    <section id="quiz-screen" class="card hidden">
      <div class="quiz-header">
        <span id="progress-text" class="progress-text"></span>
        <span id="subject" class="subject"></span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <h2 id="question" class="question"></h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden">
        <p id="feedback-result" class="feedback-result"></p>
        <p id="feedback-explanation" class="feedback-explanation"></p>
      </div>
      <button id="next-btn" class="btn btn-primary hidden">次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="card hidden">
      <p class="label">結果</p>
      <p id="score-text" class="score-text"></p>
      <p id="result-message" class="result-message"></p>
      <table class="subject-table">
        <thead>
          <tr><th>科目</th><th>正解数</th></tr>
        </thead>
        <tbody id="subject-results"></tbody>
      </table>
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
